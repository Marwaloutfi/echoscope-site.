<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Échoscope</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      background: #08080c;
      padding: 1.5rem;
      position: relative;
      transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    body.boy {
      background: radial-gradient(ellipse at 30% 20%, #0d0820, #06060a 70%);
    }

    body.girl {
      background: radial-gradient(ellipse at 70% 80%, #1a0812, #06060a 70%);
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      transition: all 2.5s ease;
    }

    .particle.p1 {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
      background: #4a3a7a;
    }

    .particle.p2 {
      width: 350px;
      height: 350px;
      bottom: -80px;
      left: -80px;
      background: #1a4a4a;
    }

    .particle.p3 {
      width: 200px;
      height: 200px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #3a1a3a;
      opacity: 0.08;
    }

    body.boy .particle.p1 {
      background: #5a4a8a;
      opacity: 0.25;
    }
    body.boy .particle.p2 {
      background: #1a5a4a;
      opacity: 0.2;
    }

    body.girl .particle.p1 {
      background: #8a4a6a;
      opacity: 0.25;
    }
    body.girl .particle.p2 {
      background: #6a3a5a;
      opacity: 0.2;
    }

    .wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: rgba(255, 255, 255, 0.015);
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      border-radius: 56px;
      padding: 3.5rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 80px 160px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.02);
      transition: all 0.6s ease;
    }

    @media (max-width: 640px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 36px;
      }
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-bottom: 0.1rem;
    }

    .logo h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 3rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #9a9aaa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .logo .badge {
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.06);
      font-family: 'Space Grotesk', sans-serif;
      margin-left: 0.2rem;
    }

    .strap {
      font-size: 0.9rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.12);
      letter-spacing: 0.06em;
      margin-top: -0.1rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .line {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06), transparent);
      margin: 0.8rem 0 2rem 0;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .choice-btn {
      padding: 1.4rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      background: rgba(255, 255, 255, 0.005);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
    }

    .choice-btn .icon {
      font-size: 1.4rem;
      opacity: 0.3;
      transition: opacity 0.4s ease;
    }

    .choice-btn .text {
      opacity: 0.3;
      transition: opacity 0.4s ease;
    }

    .choice-btn .sub {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.1;
      font-weight: 300;
    }

    .choice-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
      border-radius: 40px;
    }

    .choice-btn.boy::after {
      background: radial-gradient(circle at center, rgba(108, 92, 231, 0.06), transparent 70%);
    }

    .choice-btn.girl::after {
      background: radial-gradient(circle at center, rgba(253, 121, 168, 0.06), transparent 70%);
    }

    .choice-btn:hover {
      border-color: rgba(255, 255, 255, 0.04);
      transform: translateY(-2px);
    }

    .choice-btn:hover .icon,
    .choice-btn:hover .text {
      opacity: 1;
    }

    .choice-btn:hover::after {
      opacity: 1;
    }

    .choice-btn.boy:hover {
      border-color: rgba(108, 92, 231, 0.08);
      box-shadow: 0 0 60px rgba(108, 92, 231, 0.02);
    }

    .choice-btn.girl:hover {
      border-color: rgba(253, 121, 168, 0.08);
      box-shadow: 0 0 60px rgba(253, 121, 168, 0.02);
    }

    @media (max-width: 480px) {
      .choice-grid {
        grid-template-columns: 1fr;
      }
    }

    .screen {
      display: block;
    }

    .screen.hidden {
      display: none !important;
    }

    .quiz {
      animation: fadeUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .quiz-title {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.3rem;
      color: #fff;
    }

    .quiz-title span {
      font-weight: 600;
      background: linear-gradient(135deg, #a29bfe, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .quiz-progress {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .quiz-progress .track {
      width: 100px;
      height: 2px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 2px;
      overflow: hidden;
    }

    .quiz-progress .fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    body.boy .quiz-progress .fill {
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
    }

    body.girl .quiz-progress .fill {
      background: linear-gradient(90deg, #fd79a8, #e17055);
    }

    .quiz-progress .num {
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.06);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      text-align: right;
    }

    .quiz-body {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .q-number {
      font-size: 0.55rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.04);
      margin-bottom: 0.2rem;
    }

    .q-label {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 0.2rem;
    }

    .q-desc {
      font-size: 0.8rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.1);
      margin-bottom: 1.8rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .q-field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .q-field input,
    .q-field select {
      padding: 0.9rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.02);
      background: rgba(255, 255, 255, 0.01);
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Space Grotesk', sans-serif;
      transition: all 0.4s ease;
      outline: none;
      font-weight: 300;
    }

    .q-field input:focus,
    .q-field select:focus {
      border-color: rgba(255, 255, 255, 0.04);
      background: rgba(255, 255, 255, 0.02);
    }

    body.boy .q-field input:focus,
    body.boy .q-field select:focus {
      border-color: rgba(108, 92, 231, 0.08);
      box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.01);
    }

    body.girl .q-field input:focus,
    body.girl .q-field select:focus {
      border-color: rgba(253, 121, 168, 0.08);
      box-shadow: 0 0 0 4px rgba(253, 121, 168, 0.01);
    }

    .q-field input::placeholder {
      color: rgba(255, 255, 255, 0.04);
      font-weight: 300;
    }

    .q-field select option {
      background: #0e0e14;
      color: #fff;
    }

    .q-field input[type="date"] {
      color-scheme: dark;
    }

    .q-field input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.2);
    }

    .quiz-nav {
      display: flex;
      gap: 0.6rem;
      margin-top: 2.2rem;
    }

    .quiz-nav button {
      padding: 0.8rem 1.4rem;
      border: none;
      border-radius: 40px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      letter-spacing: 0.04em;
    }

    .btn-prev {
      background: rgba(255, 255, 255, 0.01);
      color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.01) !important;
      flex: 0.3;
    }

    .btn-prev:hover {
      background: rgba(255, 255, 255, 0.02);
      color: rgba(255, 255, 255, 0.2);
    }

    .btn-next {
      flex: 1;
      background: rgba(255, 255, 255, 0.01);
      color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.01) !important;
    }

    .btn-next:hover {
      background: rgba(255, 255, 255, 0.02);
      color: #fff;
    }

    body.boy .btn-next:hover {
      border-color: rgba(108, 92, 231, 0.05) !important;
    }

    body.girl .btn-next:hover {
      border-color: rgba(253, 121, 168, 0.05) !important;
    }

    .btn-submit {
      flex: 1;
      color: #fff !important;
      border: none !important;
      font-weight: 500 !important;
    }

    body.boy .btn-submit {
      background: linear-gradient(135deg, #6c5ce7, #3a2a6a);
    }

    body.girl .btn-submit {
      background: linear-gradient(135deg, #fd79a8, #7a2a4a);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
    }

    body.boy .btn-submit:hover {
      box-shadow: 0 12px 48px rgba(108, 92, 231, 0.08);
    }

    body.girl .btn-submit:hover {
      box-shadow: 0 12px 48px rgba(253, 121, 168, 0.08);
    }

    .result {
      margin-top: 2.2rem;
      padding: 2.2rem;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.005);
      border: 1px solid rgba(255, 255, 255, 0.01);
      animation: fadeUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .result-tag {
      display: inline-block;
      padding: 0.15rem 1.2rem;
      border-radius: 40px;
      font-size: 0.55rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    body.boy .result-tag {
      background: rgba(108, 92, 231, 0.04);
      color: #a29bfe;
      border-color: rgba(108, 92, 231, 0.03);
    }

    body.girl .result-tag {
      background: rgba(253, 121, 168, 0.04);
      color: #fd79a8;
      border-color: rgba(253, 121, 168, 0.03);
    }

    .result .title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #fff, #9a9aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
      margin-bottom: 0.1rem;
    }

    .result .sub {
      font-size: 0.95rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.15);
      margin-bottom: 0.1rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .result .meta {
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.03);
      letter-spacing: 0.06em;
      margin-bottom: 1.4rem;
      font-weight: 300;
    }

    .radar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 2rem;
      margin: 0.8rem 0;
    }

    @media (max-width: 480px) {
      .radar {
        grid-template-columns: 1fr;
      }
    }

    .radar-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .radar-item .head {
      display: flex;
      justify-content: space-between;
      font-size: 0.55rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.06);
    }

    .radar-item .head .val {
      color: rgba(255, 255, 255, 0.03);
    }

    .radar-item .bar {
      height: 2px;
      background: rgba(255, 255, 255, 0.01);
      border-radius: 2px;
      overflow: hidden;
    }

    .radar-item .bar .fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .result-foot {
      font-size: 0.55rem;
      color: rgba(255, 255, 255, 0.02);
      border-top: 1px solid rgba(255, 255, 255, 0.01);
      padding-top: 0.8rem;
      margin-top: 0.8rem;
      letter-spacing: 0.06em;
      font-family: 'Space Grotesk', sans-serif;
    }

    .result-foot i {
      font-style: normal;
      color: rgba(255, 255, 255, 0.03);
    }

    .hidden {
      display: none !important;
    }

    .quiz-body-hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
  </div>

  <div class="wrapper">
    <div class="card">

      <!-- ENTRY -->
      <div id="entry">
        <div class="logo">
          <h1>Échoscope</h1>
          <span class="badge">α</span>
        </div>
        <div class="strap">l'oracle qui révèle ta voie</div>
        <div class="line"></div>
        <div class="choice-grid">
          <button class="choice-btn boy" onclick="init('boy')">
            <span class="icon">◆</span>
            <span class="text">Masculin</span>
            <span class="sub">boy</span>
          </button>
          <button class="choice-btn girl" onclick="init('girl')">
            <span class="icon">◈</span>
            <span class="text">Féminin</span>
            <span class="sub">girl</span>
          </button>
        </div>
      </div>

      <!-- QUIZ -->
      <div id="quiz" class="screen hidden">
        <div class="quiz">
          <div class="quiz-top">
            <div class="quiz-title"><span>●</span> portrait <span style="font-weight:300;color:rgba(255,255,255,0.02);font-size:0.6rem;margin-left:0.2rem;font-family:'Space Grotesk',sans-serif;">25 questions</span></div>
            <div class="quiz-progress">
              <div class="track"><div class="fill" id="fill"></div></div>
              <span class="num" id="num">1/25</span>
            </div>
          </div>
          <div class="quiz-body" id="body">
            <div id="content"></div>
            <div class="quiz-nav">
              <button class="btn-prev" id="prev" onclick="prevQ()">←</button>
              <button class="btn-next" id="next" onclick="nextQ()">Suivant →</button>
            </div>
          </div>
          <div id="result" class="hidden result"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let gender = '';
    let idx = 0;
    let ans = {};

    const qs = [
      { id: 'birthdate', label: 'Ta date de naissance', desc: 'Le jour où tu as commencé.', type: 'date', ph: '' },
      { id: 'subjects', label: 'Matières préférées', desc: 'Celles qui te font vibrer.', type: 'text', ph: 'ex: maths, art, sport...' },
      { id: 'color', label: 'Couleur favorite', desc: 'Celle qui te représente.', type: 'text', ph: 'ex: bleu, rouge, noir...' },
      { id: 'activities', label: 'Activités passion', desc: 'Ce qui te fait oublier le temps.', type: 'text', ph: 'ex: coder, dessiner, voyager...' },
      { id: 'team', label: 'Travailler seul ou en équipe ?', desc: 'Ton rythme idéal.', type: 'select', opts: ['Seul', 'En équipe', 'Les deux'] },
      { id: 'logic', label: 'Logique ou créatif ?', desc: 'La nature de ta pensée.', type: 'select', opts: ['Logique', 'Créatif', 'Équilibré'] },
      { id: 'help', label: 'Aimer aider les autres ?', desc: 'Est-ce que ça te nourrit ?', type: 'select', opts: ['Oui', 'Non', 'Parfois'] },
      { id: 'pace', label: 'Patient ou rapide ?', desc: 'Ton tempo naturel.', type: 'select', opts: ['Patient', 'Rapide', 'Flexible'] },
      { id: 'problems', label: 'Résoudre des problèmes ?', desc: 'Tu aimes décortiquer.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'motivation', label: 'Ce qui te motive', desc: 'Ton carburant intérieur.', type: 'text', ph: 'ex: liberté, argent, impact...' },
      { id: 'math', label: 'Aimes-tu les maths ?', desc: 'Les nombres, ça te parle ?', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'science', label: 'Aimes-tu les sciences ?', desc: 'L\'univers, la matière.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'literature', label: 'Aimes-tu la littérature ?', desc: 'Les mots et les histoires.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'tech', label: 'Aimes-tu la technologie ?', desc: 'Le code, l\'IA, les gadgets.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'lifestyle', label: 'Mode de vie rêvé', desc: 'Ton quotidien idéal.', type: 'text', ph: 'ex: calme, aventure, luxe...' },
      { id: 'environment', label: 'Nature ou villes ?', desc: 'Ton environnement naturel.', type: 'select', opts: ['Nature', 'Villes', 'Les deux'] },
      { id: 'public', label: 'Parler en public ?', desc: 'Scène ou silence ?', type: 'select', opts: ['Oui', 'Non', 'Parfois'] },
      { id: 'data', label: 'Travailler avec des données ?', desc: 'Les chiffres et les stats.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'art', label: 'Aimes-tu l\'art ?', desc: 'La création pure.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'design', label: 'Aimes-tu le design ?', desc: 'La beauté fonctionnelle.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'health', label: 'Intérêt pour la santé ?', desc: 'Le corps, la biologie.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'organization', label: 'Organisé(e) ?', desc: 'L\'ordre ou le chaos ?', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'communication', label: 'Débat et communication ?', desc: 'Les mots comme armes.', type: 'select', opts: ['Oui', 'Non'] },
      { id: 'spirituality', label: 'Spirituel ou rationnel ?', desc: 'Ta vision du monde.', type: 'select', opts: ['Spirituel', 'Rationnel', 'Les deux'] },
      { id: 'dream', label: 'Ton plus grand rêve', desc: 'Ta vision ultime.', type: 'text', ph: 'ex: changer le monde, créer...' }
    ];

    function init(g) {
      gender = g;
      document.body.className = g;
      document.getElementById('entry').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      render();
    }

    function render() {
      const q = qs[idx];
      const c = document.getElementById('content');
      const f = document.getElementById('fill');
      const n = document.getElementById('num');
      const p = document.getElementById('prev');
      const nx = document.getElementById('next');

      f.style.width = ((idx + 1) / qs.length * 100) + '%';
      n.textContent = (idx + 1) + '/' + qs.length;

      let html = `
        <div class="q-number">Question ${String(idx + 1).padStart(2, '0')}</div>
        <div class="q-label">${q.label}</div>
        <div class="q-desc">${q.desc}</div>
        <div class="q-field">
      `;

      if (q.type === 'select') {
        html += `<select id="q_${q.id}">`;
        q.opts.forEach(o => {
          const s = ans[q.id] === o ? 'selected' : '';
          html += `<option ${s}>${o}</option>`;
        });
        html += `</select>`;
      } else if (q.type === 'date') {
        html += `<input type="date" id="q_${q.id}" value="${ans[q.id] || ''}" />`;
      } else {
        html += `<input type="text" id="q_${q.id}" placeholder="${q.ph}" value="${ans[q.id] || ''}" />`;
      }

      html += `</div>`;
      c.innerHTML = html;

      p.style.display = idx === 0 ? 'none' : 'block';

      if (idx === qs.length - 1) {
        nx.textContent = 'Analyser →';
        nx.className = 'btn-submit';
        nx.onclick = analyze;
      } else {
        nx.textContent = 'Suivant →';
        nx.className = 'btn-next';
        nx.onclick = nextQ;
      }

      const inp = document.getElementById(`q_${q.id}`);
      if (inp) {
        inp.addEventListener('change', () => { ans[q.id] = inp.value; });
        inp.addEventListener('input', () => { ans[q.id] = inp.value; });
      }
    }

    function nextQ() {
      save();
      if (idx < qs.length - 1) { idx++;
        render(); }
    }

    function prevQ() {
      save();
      if (idx > 0) { idx--;
        render(); }
    }

    function save() {
      const q = qs[idx];
      const inp = document.getElementById(`q_${q.id}`);
      if (inp) ans[q.id] = inp.value;
    }

    function analyze() {
      save();

      const v = id => (ans[id] || '').toLowerCase().trim();

      let s = { science: 0, tech: 0, creative: 0, social: 0, business: 0, health: 0 };

      if (v('science') === 'oui') s.science += 3;
      if (v('math') === 'oui') s.science += 2;
      if (v('tech') === 'oui') s.tech += 4;
      if (v('art') === 'oui') s.creative += 3;
      if (v('design') === 'oui') { s.creative += 3;
        s.tech += 1; }
      if (v('literature') === 'oui') s.social += 2;
      if (v('communication') === 'oui') s.social += 3;
      if (v('organization') === 'oui') s.business += 3;
      if (v('data') === 'oui') { s.tech += 2;
        s.business += 2; }
      if (v('help') === 'oui') s.social += 3;
      if (v('health') === 'oui') s.health += 4;
      if (v('problems') === 'oui') { s.science += 2;
        s.tech += 2; }

      const lg = v('logic');
      if (lg === 'logique') s.science += 3;
      else if (lg === 'créatif') s.creative += 4;
      else if (lg === 'équilibré') { s.science += 1;
        s.creative += 1; }

      const tm = v('team');
      if (tm === 'en équipe') s.social += 2;
      else if (tm === 'seul') s.tech += 1;

      const env = v('environment');
      if (env === 'nature') s.health += 1;
      else if (env === 'villes') s.business += 1;

      if (v('public') === 'oui') s.social += 2;
      else if (v('public') === 'parfois') s.social += 1;

      const sp = v('spirituality');
      if (sp === 'spirituel') s.creative += 2;
      else if (sp === 'rationnel') s.science += 2;
      else { s.creative += 1;
        s.science += 1; }

      const pc = v('pace');
      if (pc === 'patient') s.science += 1;
      else if (pc === 'rapide') s.business += 2;

      const mot = v('motivation') + ' ' + v('dream');
      if (mot.includes('argent') || mot.includes('business') || mot.includes('chef')) s.business += 2;
      if (mot.includes('créer') || mot.includes('art') || mot.includes('design')) s.creative += 2;
      if (mot.includes('santé') || mot.includes('biologie') || mot.includes('médecine')) s.health += 2;
      if (mot.includes('technologie') || mot.includes('code') || mot.includes('ia')) s.tech += 2;
      if (mot.includes('aider') || mot.includes('humanitaire') || mot.includes('impact')) s.social += 2;

      const names = {
        science: 'Sciences & Ingénierie',
        tech: 'Technologie & Digital',
        creative: 'Art & Création',
        social: 'Sciences Humaines',
        business: 'Business & Management',
        health: 'Santé & Biologie'
      };

      const jobs = {
        science: 'Ingénieur, Chercheur, Physicien ou Architecte',
        tech: 'Développeur, Data Scientist, UX Designer ou Expert IA',
        creative: 'Designer, Artiste, Réalisateur ou Créateur de contenu',
        social: 'Journaliste, Psychologue, Diplomate ou Enseignant',
        business: 'Entrepreneur, Analyste, Manager ou Consultant',
        health: 'Médecin, Biologiste, Nutritionniste ou Chercheur'
      };

      const cols = {
        science: '#6c5ce7',
        tech: '#00b894',
        creative: '#fd79a8',
        social: '#fdcb6e',
        business: '#0984e3',
        health: '#e17055'
      };

      let top = '',
        job = '',
        max = 0;
      for (let k in s) {
        if (s[k] > max) { max = s[k];
          top = names[k];
          job = jobs[k]; }
      }
      if (!top) { top = 'Multidisciplinaire';
        job = 'Explorateur de carrières'; }

      const res = document.getElementById('result');
      const bod = document.getElementById('body');
      res.classList.remove('hidden');
      bod.classList.add('quiz-body-hidden');

      let radar = '';
      for (let k in s) {
        const pct = Math.min((s[k] / 15) * 100, 100);
        radar += `
          <div class="radar-item">
            <div class="head">
              <span>${names[k]}</span>
              <span class="val">${s[k]}</span>
            </div>
            <div class="bar">
              <div class="fill" style="width:0%;background:${cols[k]}" data-target="${pct}"></div>
            </div>
          </div>
        `;
      }

      const icon = gender === 'boy' ? '◆' : '◈';

      res.innerHTML = `
        <div class="result-tag">${icon} alignement</div>
        <div class="title">${top}</div>
        <div class="sub">${job}</div>
        <div class="meta">profil ${gender} · 25 dimensions</div>
        <div class="radar">${radar}</div>
        <div class="result-foot"><i>Échoscope ·</i> basé sur tes réponses et ton potentiel</div>
      `;

      setTimeout(() => {
        document.querySelectorAll('.radar-item .fill').forEach(el => {
          const t = parseFloat(el.dataset.target);
          el.style.width = t + '%';
        });
      }, 200);

      res.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  </script>
</body>
</html>
