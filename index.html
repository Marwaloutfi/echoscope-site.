<body>

  <div class="orb orb-1" id="orb1"></div>
  <div class="orb orb-2" id="orb2"></div>
  <div class="orb orb-3" id="orb3"></div>

  <div class="container" id="app">
    <div id="gender-screen">
      <h1>Échoscope</h1>
      <p class="subhead">L'oracle qui révèle ta voie</p>
      <div class="gender-grid">
        <button class="gender-btn boy" onclick="setGender('boy')">
          <span class="emoji">⚡</span> Boy
        </button>
        <button class="gender-btn girl" onclick="setGender('girl')">
          <span class="emoji">✦</span> Girl
        </button>
      </div>
    </div>

    <div id="form-screen" class="hidden form-screen">
      <h2><i>•</i> 25 questions <span style="font-weight:400;color:rgba(255,255,255,0.2);font-size:0.9rem;">·</span> ton portrait</h2>

      <div class="question-grid" id="questionGrid">
        <div class="field-group"><label>Date de naissance</label><input type="date" id="birthdate"></div>
        <div class="field-group"><label>Matières préférées</label><input type="text" id="subjects" placeholder="ex: maths, art, sport..."></div>
        <div class="field-group"><label>Couleur favorite</label><input type="text" id="color" placeholder="ex: bleu, rouge..."></div>
        <div class="field-group"><label>Activités qui te passionnent</label><input type="text" id="activities" placeholder="ex: coder, dessiner, voyager..."></div>
        <div class="field-group"><label>Travailler seul ou en équipe ?</label><select id="team"><option>Seul</option><option>En équipe</option><option>Les deux</option></select></div>
        <div class="field-group"><label>Plutôt logique ou créatif ?</label><select id="logic"><option>Logique</option><option>Créatif</option><option>Équilibré</option></select></div>
        <div class="field-group"><label>Aimer aider les autres ?</label><select id="help"><option>Oui</option><option>Non</option><option>Parfois</option></select></div>
        <div class="field-group"><label>Plutôt patient ou rapide ?</label><select id="pace"><option>Patient</option><option>Rapide</option><option>Flexible</option></select></div>
        <div class="field-group"><label>Aimes-tu résoudre des problèmes ?</label><select id="problems"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Qu'est-ce qui te motive le plus ?</label><input type="text" id="motivation" placeholder="ex: liberté, argent, impact..."></div>
        <div class="field-group"><label>Aimes-tu les maths ?</label><select id="math"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Aimes-tu les sciences ?</label><select id="science"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Aimes-tu la littérature ?</label><select id="literature"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Aimes-tu la technologie ?</label><select id="tech"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Mode de vie rêvé</label><input type="text" id="lifestyle" placeholder="ex: calme, aventure, luxe..."></div>
        <div class="field-group"><label>Nature ou villes ?</label><select id="environment"><option>Nature</option><option>Villes</option><option>Les deux</option></select></div>
        <div class="field-group"><label>Parler en public ?</label><select id="public"><option>Oui</option><option>Non</option><option>Parfois</option></select></div>
        <div class="field-group"><label>Travailler avec des données ?</label><select id="data"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Aimes-tu l'art ?</label><select id="art"><option>Oui</option><option>Non</option></select></div>
        <div class="field-group"><label>Aimes-tu le design ?</label><select id="design"><option>Oui</option><option>Non</option></select></div>

      <button class="btn-primary" onclick="analyze()">🔮 Analyser mon profil</button>

  <script>
    let gender = "";

    function setGender(g) {
      gender = g;
      document.getElementById('gender-screen').classList.add('hidden');
      document.getElementById('form-screen').classList.remove('hidden');

      const body = document.body;
      const orb1 = document.getElementById('orb1');
      const orb2 = document.getElementById('orb2');
      const orb3 = document.getElementById('orb3');

      if (g === 'boy') {
        body.style.background = '#0b0b0e';
        orb1.style.background = '#6c5ce7';
        orb2.style.background = '#00b894';
        orb3.style.background = '#0984e3';
      } else {
        body.style.background = '#0b0b0e';
        orb1.style.background = '#fd79a8';
        orb2.style.background = '#e17055';
        orb3.style.background = '#fdcb6e';
      }
    }

    function analyze() {
      const val = id => document.getElementById(id).value.toLowerCase().trim();

      let scores = {
        science: 0, tech: 0, creative: 0, social: 0, business: 0, health: 0
      };

      if (val('science') === 'oui') scores.science += 3;
      if (val('math') === 'oui') scores.science += 2;
      if (val('tech') === 'oui') scores.tech += 4;
      if (val('art') === 'oui') scores.creative += 3;
      if (val('design') === 'oui') { scores.creative += 3; scores.tech += 1; }
      if (val('literature') === 'oui') scores.social += 2;
      if (val('communication') === 'oui') scores.social += 3;
      if (val('organization') === 'oui') scores.business += 3;
      if (val('data') === 'oui') { scores.tech += 2; scores.business += 2; }
      if (val('help') === 'oui') scores.social += 3;
      if (val('health') === 'oui') scores.health += 4;
      if (val('problems') === 'oui') { scores.science += 2; scores.tech += 2; }

      const logic = val('logic');
      if (logic === 'logique') scores.science += 3;
      else if (logic === 'créatif') scores.creative += 4;
      else if (logic === 'équilibré') { scores.science += 1; scores.creative += 1; }

      const team = val('team');
      if (team === 'en équipe') scores.social += 2;
      else if (team === 'seul') scores.tech += 1;

      const env = val('environment');
      if (env === 'nature') scores.health += 1;
      else if (env === 'villes') scores.business += 1;

      if (val('public') === 'oui') scores.social += 2;
      else if (val('public') === 'parfois') scores.social += 1;

      const spirit = val('spirituality');
      if (spirit === 'spirituel') scores.creative += 2;
      else if (spirit === 'rationnel') scores.science += 2;
      else { scores.creative += 1; scores.science += 1; }

      const pace = val('pace');
      if (pace === 'patient') scores.science += 1;
      else if (pace === 'rapide') scores.business += 2;

      const motiv = val('motivation') + ' ' + val('dream');
      if (motiv.includes('argent') || motiv.includes('business') || motiv.includes('chef')) scores.business += 2;
      if (motiv.includes('créer') || motiv.includes('art') || motiv.includes('design')) scores.creative += 2;
      if (motiv.includes('santé') || motiv.includes('biologie') || motiv.includes('médecine')) scores.health += 2;
      if (motiv.includes('technologie') || motiv.includes('code') || motiv.includes('ia')) scores.tech += 2;
      if (motiv.includes('aider') || motiv.includes('humanitaire') || motiv.includes('impact')) scores.social += 2;

      let topField = '';
      let topJob = '';
      let maxScore = 0;
      let fieldNames = {
        science: 'Sciences & Ingénierie',
        tech: 'Technologie & Digital',
        creative: 'Art & Création',
        social: 'Sciences Humaines & Communication',
        business: 'Business & Management',
        health: 'Santé & Biologie'
      };
      let jobSuggestions = {
        science: 'Ingénieur(e), Chercheur(e), Physicien(ne) ou Architecte',
        tech: 'Développeur(euse), Data Scientist, UX Designer ou Expert IA',
        creative: 'Designer, Artiste, Réalisateur(trice) ou Créateur de contenu',
        social: 'Journaliste, Psychologue, Diplomate ou Enseignant(e)',
        business: 'Entrepreneur(euse), Analyste financier, Manager ou Consultant(e)',
        health: 'Médecin, Biologiste, Nutritionniste ou Chercheur(e) en santé'
      };

      for (let key in scores) {
        if (scores[key] > maxScore) {
          maxScore = scores[key];
          topField = fieldNames[key];
          topJob = jobSuggestions[key];
        }
      }

      if (!topField) {
        topField = 'Multidisciplinaire';
        topJob = 'Explorateur(trice) de carrières — ta curiosité est ta force !';
      }

      const resultDiv = document.getElementById('result');
      resultDiv.classList.remove('hidden');
      resultDiv.innerHTML = `
        <div class="badge">✦ alignement cosmique ✦</div>
        <div class="field-name">${topField}</div>
        <div class="job-title">${topJob}</div>
        <div style="font-size:0.85rem;color:rgba(255,255,255,0.25);margin-top:-0.1rem;">
          ${gender === 'boy' ? '⚡' : '✦'} profil ${gender} · analyse en 25 dimensions
        </div>
        <div class="footnote"><i>Échoscope ·</i> recommandation basée sur tes réponses, ton énergie et ton potentiel</div>
      `;

      resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  </script>
</body>
</html>
